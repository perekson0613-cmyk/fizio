<script>
  const bookingForm = document.getElementById("bookingForm");
  const serviceSelect = document.getElementById("service");
  const selectedInfo = document.getElementById("selectedInfo");
  const confirmation = document.getElementById("confirmation");
  const confirmationDetails =
    document.getElementById("confirmationDetails");

  const sendConfirmation =
    document.getElementById("sendConfirmation");

  const newBooking =
    document.getElementById("newBooking");

  const dateInput =
    document.getElementById("date");

  const timeSelect =
    document.getElementById("time");


  /* =========================
     DZISIEJSZA DATA
  ========================= */

  const today = new Date();

  const todayString =
    today.getFullYear() +
    "-" +
    String(today.getMonth() + 1).padStart(2, "0") +
    "-" +
    String(today.getDate()).padStart(2, "0");

  dateInput.min = todayString;


  /* =========================
     GODZINY 15:00 - 21:00
     CO 20 MINUT
  ========================= */

  timeSelect.innerHTML = `
    <option value="">Wybierz godzinę</option>
  `;

  for (let hour = 15; hour <= 21; hour++) {

    for (let minute = 0; minute < 60; minute += 20) {

      // O 21:00 nie dodajemy 21:20 ani 21:40
      if (hour === 21 && minute > 0) {
        continue;
      }

      const time =
        String(hour).padStart(2, "0") +
        ":" +
        String(minute).padStart(2, "0");

      const option =
        document.createElement("option");

      option.value = time;
      option.textContent = time;

      timeSelect.appendChild(option);
    }
  }


  /* =========================
     INFORMACJA O WYBRANEJ USŁUDZE
  ========================= */

  serviceSelect.addEventListener("change", function () {

    const selected =
      this.options[this.selectedIndex];

    if (!selected.value) {
      selectedInfo.style.display = "none";
      return;
    }

    const price =
      selected.dataset.price;

    const duration =
      selected.dataset.duration;

    selectedInfo.innerHTML = `
      <strong>${selected.value}</strong><br>
      Czas trwania: ${duration}<br>
      Cena: ${price} zł
    `;

    selectedInfo.style.display = "block";
  });


  /* =========================
     UMÓWIENIE WIZYTY
  ========================= */

  bookingForm.addEventListener("submit", function (event) {

    event.preventDefault();

    const name =
      document.getElementById("name").value.trim();

    const phone =
      document.getElementById("phone").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const service =
      serviceSelect.value;

    const date =
      dateInput.value;

    const time =
      timeSelect.value;

    const message =
      document.getElementById("message")
        ? document.getElementById("message").value.trim()
        : "";


    if (
      !name ||
      !phone ||
      !email ||
      !service ||
      !date ||
      !time
    ) {
      alert("Uzupełnij wszystkie wymagane pola.");
      return;
    }


    const selected =
      serviceSelect.options[
        serviceSelect.selectedIndex
      ];

    const price =
      selected.dataset.price;

    const duration =
      selected.dataset.duration;


    const formattedDate =
      new Date(date + "T00:00:00")
        .toLocaleDateString("pl-PL");


    /* =========================
       PODZIĘKOWANIE
    ========================= */

    confirmationDetails.innerHTML = `
      <div><strong>Imię i nazwisko:</strong> ${name}</div>
      <div><strong>Telefon:</strong> ${phone}</div>
      <div><strong>E-mail:</strong> ${email}</div>
      <div><strong>Usługa:</strong> ${service}</div>
      <div><strong>Czas trwania:</strong> ${duration}</div>
      <div><strong>Cena:</strong> ${price} zł</div>
      <div><strong>Data:</strong> ${formattedDate}</div>
      <div><strong>Godzina:</strong> ${time}</div>
    `;


    /* =========================
       WIADOMOŚĆ DO SPECJALISTY
    ========================= */

    let emailBody =
      `Dzień dobry,

potwierdzam umówienie wizyty w FIZIO.

Imię i nazwisko: ${name}
Telefon: ${phone}
E-mail: ${email}
Usługa: ${service}
Czas trwania: ${duration}
Cena: ${price} zł
Data: ${formattedDate}
Godzina: ${time}`;

    if (message) {
      emailBody += `
Dodatkowa wiadomość: ${message}`;
    }

    emailBody += `

Pozdrawiam,
${name}`;


    sendConfirmation.href =
      "mailto:kacperson.0613@gmail.com" +
      "?subject=" +
      encodeURIComponent("Potwierdzenie wizyty — FIZIO") +
      "&body=" +
      encodeURIComponent(emailBody);


    /* =========================
       ZAMIEŃ FORMULARZ
       NA PODZIĘKOWANIE
    ========================= */

    bookingForm.style.display = "none";

    confirmation.style.display = "block";

    confirmation.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

  });


  /* =========================
     KOLEJNA WIZYTA
  ========================= */

  if (newBooking) {

    newBooking.addEventListener("click", function () {

      bookingForm.reset();

      selectedInfo.style.display = "none";

      confirmation.style.display = "none";

      bookingForm.style.display = "block";

      document.getElementById("rezerwacja")
        .scrollIntoView({
          behavior: "smooth"
        });

    });

  }
</script>
