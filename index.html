<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fizio – Fizjoterapia i Masaż</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7f6;
  color: #1f2933;
}

header {
  background: #1f6f5b;
  color: white;
  text-align: center;
  padding: 60px 20px;
}

header h1 {
  font-size: 42px;
  margin: 0 0 10px;
}

header p {
  font-size: 19px;
  margin: 0;
}

nav {
  background: white;
  padding: 15px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px #00000015;
}

nav a {
  color: #1f6f5b;
  text-decoration: none;
  margin: 0 12px;
  font-weight: bold;
}

section {
  max-width: 1000px;
  margin: auto;
  padding: 55px 20px;
}

h2 {
  text-align: center;
  color: #1f6f5b;
  font-size: 30px;
  margin-bottom: 35px;
}

.services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 4px 15px #00000012;
}

.card h3 {
  color: #1f6f5b;
}

.price {
  font-size: 24px;
  font-weight: bold;
}

form {
  background: white;
  max-width: 600px;
  margin: auto;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #00000012;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select,
